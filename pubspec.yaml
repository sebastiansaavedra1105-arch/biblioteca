name: biblio
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8
  path: ^1.9.0
  sqlite3_flutter_libs: ^0.5.40
  crypto: ^3.0.7
  barcode_widget: ^2.0.4
  image_picker: ^1.1.2
  provider: ^6.0.5
  supabase_flutter: ^2.10.3
  connectivity_plus: ^7.0.0
  uuid: ^4.5.2
  flutter_dotenv: ^5.0.2
  bcrypt: ^1.1.3
  file_picker: ^8.0.0
  csv: ^6.0.0
  pdf: ^3.11.0
  printing: ^5.11.0
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  google_fonts: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: false      
  ios: false          
  image_path: "assets/images/logo_colegio.png" 
  min_sdk_android: 21 
  web:
    generate: true
    image_path: "assets/images/logo_colegio.png"
  windows:
    generate: true
    icon_size: 48
    image_path: "assets/images/logo_colegio.png"
  linux:
    generate: true
    image_path: "assets/images/logo_colegio.png"